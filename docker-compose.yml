name: poschtiliste

services:
  webapp:
    build: .
    image: poschtiliste:latest
    # the image applies pending migrations and only starts the server if they succeed
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DATABASE_CLIENT: pg
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-poschtiliste}
      DATABASE_USER: ${POSTGRES_USER:-poschtiliste}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poschtiliste}
      POSTGRES_USER: ${POSTGRES_USER:-poschtiliste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # named volume by default, a host path in DATA_VOLUME turns it into a bind mount
      - ${DATA_VOLUME:-poschtiliste-database}:/var/lib/postgresql

  jenkins:
    build: jenkins
    image: poschtiliste-jenkins:latest
    # only started with "docker compose up jenkins" or "--profile jenkins"
    profiles:
      - jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    # the group of the docker socket, 0 on docker desktop, the docker group on linux hosts
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      JENKINS_LOCATION_URL: http://localhost:${JENKINS_PORT:-8080}/
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - poschtiliste-jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  poschtiliste-database:
    name: poschtiliste-database
  poschtiliste-jenkins-home:
    name: poschtiliste-jenkins-home
